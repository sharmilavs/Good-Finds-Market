services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes: ["cassandra_data:/var/lib/cassandra"]
volumes:
  mongo_data:
  cassandra_data:
